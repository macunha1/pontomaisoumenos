name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [python314, python315]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
        with:
          shell: ${{ matrix.shell }}
      - name: Validate and package through the shared graph
        run: |
          time nix develop .#${{ matrix.shell }} --profile "${RUNNER_TEMP}/nix-devenv" \
            --impure --no-update-lock-file --command devenv tasks run app:ci
          git diff --exit-code -- flake.lock uv.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-${{ matrix.shell }}
          path: dist/
          if-no-files-found: error
  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution-python314
          path: dist/
      - name: Build and smoke-test the verified distribution image
        run: |
          time nix develop .#python314 --profile "${RUNNER_TEMP}/nix-devenv" \
            --impure --no-update-lock-file --command devenv tasks run app:image
