# Optional non-secret configuration. PM_ environment variables override every value.
timezone = "America/Sao_Paulo"
holiday_subdivision = "SP"
# Enabled optional holidays become full days off. Use [] to disable all optional entries.
enabled_optional_holidays = ["carnival"]
log_level = "INFO"

[working_hours]
possible_minutes_variation_start = 0
possible_minutes_variation_end = 59 # exclusive
possible_start_hour = 9
lunch_time = 1.0
accepted_start_hour_variation = 1.23
maximum_daily_working_hours = 10.0
expected_daily_hours = 8.8

[location]
address = "Av. Paulista, 2300 - Bela Vista, São Paulo - SP, Brasil"
latitude = -23.556828
longitude = -46.6618655
