x-application: &application
  build: .
  image: ${APP_DOCKER_IMAGE:-pontomaisoumenos:local}
  environment:
    PM_DATABASE_URL: sqlite+aiosqlite:////data/pontomaisoumenos.db
    PM_USER__EMAIL: ${PM_USER__EMAIL:?Set PM_USER__EMAIL in .env}
    PM_USER__PASSWORD: ${PM_USER__PASSWORD:?Set PM_USER__PASSWORD in .env}
  volumes:
    - application_data:/data
    - ./config/default.toml:/etc/pontomaisoumenos.toml:ro
  init: true
  stop_grace_period: 90s

services:
  migrate:
    <<: *application
    command: ["--config", "/etc/pontomaisoumenos.toml", "migrate"]
  application:
    <<: *application
    restart: unless-stopped
    command: ["--config", "/etc/pontomaisoumenos.toml", "serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  application_data:
